services:
 
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: container-06112026-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SenhaForte123!"
    ports:
      - "1433:1433"
    volumes:
      - volume-06112026-sql:/var/opt/mssql
    networks:
      - network-06112026    
      
  api-jogos:
    build:
      context: ..
      dockerfile: ./api_jogos/Dockerfile    
    image: image-06112026-api-jogos:latest
    container_name: container-06112026-api-jogos
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__conexao=Server=sqlserver,1433;Database=db_jogos;User Id=sa;Password=SenhaForte123!;TrustServerCertificate=true;      
      - AzureFunctionGeminiUrl=http://fn-jogos-gemini:80/api/azure-function-gemini
    ports:
      - "1000:8080"
    depends_on:
      - sqlserver
    networks:
      - network-06112026    

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: container-06112026-azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - volume-06112026-azurite:/data
    networks:
      - network-06112026

  fn-jogos-gemini:
    build:
      context: ..
      dockerfile: ./fn_jogos_gemini/Dockerfile
    image: image-06112026-fn-jogos-gemini:latest
    container_name: container-06112026-fn-jogos-gemini
    hostname: fn-jogos-gemini
    environment:
      - AzureWebJobsStorage=UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://azurite
      - FUNCTIONS_WORKER_RUNTIME=dotnet-isolated
      - FUNCTIONS_HTTP_PORT=80
      - GEMINI_API_KEY=[SUA API KEY]
    ports:
      - "7072:80"
    depends_on:
      - api-jogos
      - azurite
    networks:
      - network-06112026
  
volumes:
  volume-06112026-sql:
    driver: local
  volume-06112026-azurite:   
    driver: local

networks:
  network-06112026:
    driver: bridge